<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 9 Practice Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-8">

    <div class="max-w-2xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">ML in Epidemiology Quiz</h1>
            <a href="index.html" class="text-sm text-emerald-600 hover:underline">Back to Portal</a>
        </div>

        <div id="quiz-container" class="bg-white rounded-xl shadow-sm border border-slate-200 p-8"></div>

        <div id="result-container" class="hidden mt-6 bg-emerald-50 border border-emerald-200 p-6 rounded-xl text-center">
            <h2 class="text-2xl font-bold text-emerald-800 mb-2">Quiz Complete!</h2>
            <p class="text-emerald-700">You scored <span id="score" class="font-bold text-xl"></span> out of 4.</p>
            <p class="text-sm text-emerald-600 mt-4">"The prediction vs causal distinction is the most important methodological boundary in contemporary epidemiology."</p>
            <button onclick="location.reload()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded font-medium hover:bg-emerald-700 transition">Retry Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "A researcher trains an XGBoost model on EMR data to assign a probability of 30-day readmission to patients, so ward staff can flag high-risk individuals. What is the primary task here?",
                options: ["Causal effect estimation", "Instrumental variable analysis", "Prediction / Risk Stratification", "Pattern Detection / Clustering"],
                correct: 2,
                explanation: "This is pure prediction. The goal is to accurately assign a risk score to identify 'Who' will get the outcome, without making claims about 'Why' or how to intervene on specific features."
            },
            {
                question: "A Random Forest model finds that 'household income' is the most important predictor (highest SHAP value) for childhood stunting. The researcher concludes: 'Increasing income will reduce stunting.' What is the error?",
                options: ["Random forests cannot handle continuous variables.", "SHAP values provide predictive explanations, not causal effect estimates.", "They should have used Logistic Regression instead.", "Household income is a collider."],
                correct: 1,
                explanation: "SHAP values explain *why* the model made a prediction based on associations in the data. Because observational data is confounded, SHAP values cannot be used to estimate what happens if we intervene."
            },
            {
                question: "A neural network predicts HIV default. The Training AUC is 0.97, but the Validation AUC is 0.71. What is the most likely cause?",
                options: ["Confounding by indication", "Algorithmic bias", "Overfitting", "Non-differential misclassification"],
                correct: 2,
                explanation: "A massive gap between training and validation performance indicates Overfitting. The model memorized the noise in the training data and failed to generalize to new data."
            },
            {
                question: "Why is Double Machine Learning (DML) advantageous when adjusting for a very large set of confounders?",
                options: ["It automatically turns a prediction model into an RCT.", "It uses ML to flexibly estimate nuisance functions (E[Y|X] and E[D|X]) to prevent regularisation bias in the causal estimate.", "It removes the need to draw a DAG.", "It allows you to adjust for colliders safely."],
                correct: 1,
                explanation: "DML uses the flexibility of ML to estimate exposure and outcome probabilities (nuisance functions) non-parametrically, preventing model misspecification bias, while still providing a valid causal estimate from the residuals."
            }
        ];

        let currentQ = 0; let score = 0;
        const container = document.getElementById('quiz-container');

        function loadQuestion() {
            if (currentQ >= questions.length) {
                container.classList.add('hidden');
                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('score').innerText = score;
                return;
            }
            const q = questions[currentQ];
            let html = `<h2 class="text-lg font-bold text-slate-800 mb-4">Q${currentQ + 1}: ${q.question}</h2><div class="space-y-3">`;
            q.options.forEach((opt, idx) => {
                html += `<button onclick="checkAnswer(${idx})" class="w-full text-left p-4 rounded-lg border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 transition-colors">${opt}</button>`;
            });
            html += `</div><div id="feedback" class="mt-4 hidden p-3 rounded text-sm"></div>`;
            container.innerHTML = html;
        }

        function checkAnswer(selected) {
            const q = questions[currentQ];
            const feedback = document.getElementById('feedback');
            if(!feedback.classList.contains('hidden')) return;
            feedback.classList.remove('hidden');
            if (selected === q.correct) {
                score++;
                feedback.className = "mt-4 p-3 rounded text-sm bg-emerald-100 text-emerald-800";
                feedback.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
                feedback.className = "mt-4 p-3 rounded text-sm bg-rose-100 text-rose-800";
                feedback.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
            }
            setTimeout(() => { currentQ++; loadQuestion(); }, 5000);
        }
        loadQuestion();
    </script>
</body>
</html>
