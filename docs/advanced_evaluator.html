<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confounding Control Method Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Advanced Control Method Selector</h1>
            <a href="index.html" class="text-sm text-sky-600 hover:underline">Back to Portal</a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-6 md:p-8 bg-sky-900 text-white">
                <p class="text-sky-200 text-sm">Answer 4 quick questions about your study to determine the most appropriate advanced confounding control strategy.</p>
            </div>

            <div class="p-8 space-y-8">
                <!-- Q1 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3">1. At what phase is your study?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('phase', 'design')" id="btn-design" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Design Phase (Pre-collection)</button>
                        <button onclick="setVal('phase', 'analysis')" id="btn-analysis" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Analysis Phase (Post-hoc)</button>
                    </div>
                </div>

                <!-- Q2 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3">2. How many confounders are you adjusting for?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('count', 'few')" id="btn-few" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Few (1-2 categorical)</button>
                        <button onclick="setVal('count', 'many')" id="btn-many" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Many (High-dimensional)</button>
                    </div>
                </div>

                <!-- Q3 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3">3. What is your target population for inference?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('target', 'ate')" id="btn-ate" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Full Population (ATE)</button>
                        <button onclick="setVal('target', 'att')" id="btn-att" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Treated Only (ATT)</button>
                    </div>
                </div>

                <!-- Q4 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3">4. Are your confounders time-varying?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('time', 'no')" id="btn-time-no" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">No (Baseline only)</button>
                        <button onclick="setVal('time', 'yes')" id="btn-time-yes" class="q-btn border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Yes (Sequential)</button>
                    </div>
                </div>

                <div id="resultBox" class="hidden p-6 rounded-xl border-l-4 bg-sky-50 border-sky-500">
                    <h3 class="text-xl font-bold text-sky-900 mb-2">Recommended Method: <span id="methodName"></span></h3>
                    <p id="methodDesc" class="text-sm text-sky-800 mb-4"></p>
                    <div id="rCode" class="bg-slate-800 text-slate-300 p-4 rounded-lg font-mono text-xs overflow-x-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = { phase: '', count: '', target: '', time: '' };

        function setVal(key, val) {
            state[key] = val;
            // Update UI
            document.querySelectorAll(`[id^="btn-${key}"]`).forEach(b => b.classList.remove('bg-sky-100', 'border-sky-500', 'text-sky-700'));
            document.getElementById(`btn-${key === 'time' ? 'time-' + val : val}`).classList.add('bg-sky-100', 'border-sky-500', 'text-sky-700');
            calculate();
        }

        function calculate() {
            if (!state.phase || !state.count || !state.target || !state.time) return;

            const res = document.getElementById('resultBox');
            const name = document.getElementById('methodName');
            const desc = document.getElementById('methodDesc');
            const code = document.getElementById('rCode');
            res.classList.remove('hidden');

            if (state.phase === 'design') {
                name.innerText = "Matching (Individual/Pair)";
                desc.innerText = "Effective for strong confounders at the start of a case-control study. Ensures groups are identical on selected variables.";
                code.innerText = "matchit(treated ~ age + sex, data = df, method = 'nearest')";
            } else if (state.time === 'yes') {
                name.innerText = "IPTW (Marginal Structural Models)";
                desc.innerText = "The only standard way to handle time-varying confounding where treatment affects future confounders.";
                code.innerText = "weightit(treated ~ ..., estimand = 'ATE')\nsvyglm(outcome ~ treated, design = ...)";
            } else if (state.count === 'many' && state.target === 'att') {
                name.innerText = "Propensity Score Matching";
                desc.innerText = "Best for balancing a high number of baseline covariates when interested in the effect on those actually treated.";
                code.innerText = "matchit(treated ~ age + sex + bmi + ..., method = 'nearest', caliper = 0.2)";
            } else if (state.count === 'many' && state.target === 'ate') {
                name.innerText = "IPTW (ATE Weights)";
                desc.innerText = "Creates a pseudo-population to estimate what would happen if the entire population were treated.";
                code.innerText = "weights = ifelse(T==1, 1/PS, 1/(1-PS))";
            } else {
                name.innerText = "Stratification / Mantel-Haenszel";
                desc.innerText = "Transparent and simple for 1-2 categorical confounders. Good for checking homogeneity across groups.";
                code.innerText = "mantelhaen.test(disease, exposure, age_strata)";
            }
        }
    </script>
</body>
</html>
