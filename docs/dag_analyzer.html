<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Pathway & DAG Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Causal Pathway Analyzer</h1>
            <a href="index.html" class="text-sm text-sky-600 hover:underline">Back to Portal</a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-6 md:p-8 bg-slate-800 text-white">
                <p class="text-slate-300">
                    Define the relationship between your <strong>Exposure (E)</strong>, <strong>Outcome (O)</strong>, and a <strong>Third Variable (Z)</strong>. The analyzer will identify the structure (Confounder, Collider, or Mediator) and advise if you should adjust for it.
                </p>
            </div>

            <div class="p-6 md:p-8">
                <!-- Diagram Visualizer -->
                <div class="flex items-center justify-center space-x-4 md:space-x-12 mb-10 bg-slate-50 p-8 rounded-xl border border-slate-200">
                    
                    <div class="text-center">
                        <div class="w-16 h-16 bg-blue-100 border-2 border-blue-500 rounded-full flex items-center justify-center font-bold text-blue-700 text-xl mx-auto mb-2">E</div>
                        <span class="text-sm font-semibold">Exposure</span>
                    </div>

                    <div class="flex flex-col items-center justify-center w-32 relative">
                        <div id="arrowEZ" class="text-slate-400 text-2xl font-bold absolute -top-8 -left-4 hidden">↖</div>
                        <div id="arrowZE" class="text-slate-400 text-2xl font-bold absolute -top-8 -left-4 hidden">↙</div>
                        
                        <div class="w-16 h-16 bg-purple-100 border-2 border-purple-500 rounded-full flex items-center justify-center font-bold text-purple-700 text-xl z-10 mb-2">Z</div>
                        <span class="text-sm font-semibold text-center">Third<br>Variable</span>

                        <div id="arrowZO" class="text-slate-400 text-2xl font-bold absolute -top-8 -right-4 hidden">↘</div>
                        <div id="arrowOZ" class="text-slate-400 text-2xl font-bold absolute -top-8 -right-4 hidden">↗</div>
                    </div>

                    <div class="text-center">
                        <div class="w-16 h-16 bg-red-100 border-2 border-red-500 rounded-full flex items-center justify-center font-bold text-red-700 text-xl mx-auto mb-2">O</div>
                        <span class="text-sm font-semibold">Outcome</span>
                    </div>

                </div>

                <!-- Input Controls -->
                <div class="grid md:grid-cols-2 gap-8 mb-8">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Relationship: Exposure (E) and Z</label>
                        <select id="relEZ" onchange="analyze()" class="w-full border-2 border-slate-200 rounded p-3 focus:border-sky-500 outline-none bg-white">
                            <option value="none">No causal link</option>
                            <option value="Z_causes_E">Z causes Exposure (Z → E)</option>
                            <option value="E_causes_Z">Exposure causes Z (E → Z)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Relationship: Z and Outcome (O)</label>
                        <select id="relZO" onchange="analyze()" class="w-full border-2 border-slate-200 rounded p-3 focus:border-sky-500 outline-none bg-white">
                            <option value="none">No causal link</option>
                            <option value="Z_causes_O">Z causes Outcome (Z → O)</option>
                            <option value="O_causes_Z">Outcome causes Z (O → Z)</option>
                        </select>
                    </div>
                </div>

                <!-- Result Box -->
                <div id="resultBox" class="hidden p-6 rounded-xl border-l-4">
                    <h3 id="resTitle" class="text-xl font-bold mb-2"></h3>
                    <p id="resDesc" class="text-sm mb-4"></p>
                    <div id="resAction" class="inline-block px-4 py-2 rounded font-bold text-sm"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function hideArrows() {
            document.getElementById('arrowEZ').classList.add('hidden');
            document.getElementById('arrowZE').classList.add('hidden');
            document.getElementById('arrowZO').classList.add('hidden');
            document.getElementById('arrowOZ').classList.add('hidden');
        }

        function analyze() {
            const ez = document.getElementById('relEZ').value;
            const zo = document.getElementById('relZO').value;
            const resBox = document.getElementById('resultBox');
            const title = document.getElementById('resTitle');
            const desc = document.getElementById('resDesc');
            const action = document.getElementById('resAction');

            hideArrows();
            resBox.className = "p-6 rounded-xl border-l-4"; // reset classes

            // Draw Arrows
            if (ez === 'Z_causes_E') document.getElementById('arrowZE').classList.remove('hidden');
            if (ez === 'E_causes_Z') document.getElementById('arrowEZ').classList.remove('hidden');
            if (zo === 'Z_causes_O') document.getElementById('arrowZO').classList.remove('hidden');
            if (zo === 'O_causes_Z') document.getElementById('arrowOZ').classList.remove('hidden');

            if (ez === 'none' || zo === 'none') {
                resBox.classList.add('hidden');
                return;
            }

            resBox.classList.remove('hidden');

            // Logic
            if (ez === 'Z_causes_E' && zo === 'Z_causes_O') {
                // Fork / Confounder
                resBox.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                title.innerText = "Z is a Confounder (Fork: E ← Z → O)";
                desc.innerText = "Z is a common cause of both the exposure and the outcome. It opens a 'backdoor path' that creates a spurious association.";
                action.className = "inline-block px-4 py-2 rounded font-bold text-sm bg-emerald-200 text-emerald-900";
                action.innerText = "ACTION: ADJUST (Control for Z to achieve exchangeability)";
            
            } else if (ez === 'E_causes_Z' && zo === 'O_causes_Z') {
                // Inverted Fork / Collider
                resBox.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                title.innerText = "Z is a Collider (Inverted Fork: E → Z ← O)";
                desc.innerText = "Z is a common effect of both the exposure and the outcome. The path is naturally blocked. Conditioning on Z will OPEN a spurious path (Berkson's bias / Collider bias).";
                action.className = "inline-block px-4 py-2 rounded font-bold text-sm bg-rose-200 text-rose-900";
                action.innerText = "ACTION: DO NOT ADJUST (Avoid conditioning on Z)";
            
            } else if (ez === 'E_causes_Z' && zo === 'Z_causes_O') {
                // Chain / Mediator
                resBox.classList.add('bg-indigo-50', 'border-indigo-500', 'text-indigo-900');
                title.innerText = "Z is a Mediator (Chain: E → Z → O)";
                desc.innerText = "Z lies on the causal pathway between the exposure and the outcome. It explains *how* the exposure causes the outcome.";
                action.className = "inline-block px-4 py-2 rounded font-bold text-sm bg-indigo-200 text-indigo-900";
                action.innerText = "ACTION: DO NOT ADJUST (If estimating Total Effect)";
            
            } else if (ez === 'Z_causes_E' && zo === 'O_causes_Z') {
                // Impossible backward time travel or complex loop
                resBox.classList.add('bg-orange-50', 'border-orange-500', 'text-orange-900');
                title.innerText = "Acyclic Violation / Reverse Causation";
                desc.innerText = "If Z causes E, but O causes Z, this implies the outcome is causing the exposure backwards through time. Review your temporal assumptions.";
                action.className = "inline-block px-4 py-2 rounded font-bold text-sm bg-orange-200 text-orange-900";
                action.innerText = "ACTION: RE-EVALUATE DAG";
            }
        }
    </script>
</body>
</html>
