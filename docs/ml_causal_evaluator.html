<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Decision Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Variable Inclusion Decision Engine</h1>
            <a href="index.html" class="text-sm text-sky-600 hover:underline">Back to Portal</a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-6 bg-slate-800 text-white text-center">
                <p class="text-slate-300 text-sm uppercase font-bold tracking-widest">Prediction vs. Causal Framework</p>
                <p class="mt-1 text-xs">How you treat a variable depends entirely on the goal of your model.</p>
            </div>

            <div class="p-8 space-y-8">
                <!-- Step 1: Goal -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">1. What is the goal of your analysis?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setGoal('predict')" id="btn-goal-predict" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition text-sm">
                            <span class="block font-bold mb-1">Prediction</span>
                            <span class="text-xs text-slate-500">"Who will develop the outcome?"</span>
                        </button>
                        <button onclick="setGoal('causal')" id="btn-goal-causal" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition text-sm">
                            <span class="block font-bold mb-1">Causal Inference</span>
                            <span class="text-xs text-slate-500">"What happens if we intervene on X?"</span>
                        </button>
                    </div>
                </div>

                <!-- Step 2: Variable Type -->
                <div id="step2" class="opacity-50 pointer-events-none transition-opacity">
                    <label class="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">2. Based on your DAG, what is the role of the variable?</label>
                    <div class="grid grid-cols-3 gap-4">
                        <button onclick="setVar('confounder')" id="btn-var-confounder" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition text-sm font-bold">Confounder</button>
                        <button onclick="setVar('mediator')" id="btn-var-mediator" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition text-sm font-bold">Mediator</button>
                        <button onclick="setVar('collider')" id="btn-var-collider" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition text-sm font-bold">Collider</button>
                    </div>
                </div>

                <!-- Result -->
                <div id="resultBox" class="hidden p-6 rounded-xl border-l-4 shadow-sm transition-all duration-300">
                    <h3 class="text-xl font-black mb-2" id="actionTitle"></h3>
                    <p id="actionDesc" class="text-sm font-medium leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = { goal: '', variable: '' };

        function setGoal(val) {
            state.goal = val;
            document.querySelectorAll(`[id^="btn-goal-"]`).forEach(b => b.classList.remove('bg-indigo-600', 'border-indigo-600', 'text-white'));
            document.getElementById(`btn-goal-${val}`).classList.add('bg-indigo-600', 'border-indigo-600', 'text-white');
            
            document.getElementById('step2').classList.remove('opacity-50', 'pointer-events-none');
            calculate();
        }

        function setVar(val) {
            state.variable = val;
            document.querySelectorAll(`[id^="btn-var-"]`).forEach(b => b.classList.remove('bg-indigo-600', 'border-indigo-600', 'text-white'));
            document.getElementById(`btn-var-${val}`).classList.add('bg-indigo-600', 'border-indigo-600', 'text-white');
            calculate();
        }

        function calculate() {
            if (!state.goal || !state.variable) return;
            const res = document.getElementById('resultBox');
            res.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'bg-rose-50', 'border-rose-500', 'text-rose-900', 'bg-indigo-50', 'border-indigo-500', 'text-indigo-900');

            const title = document.getElementById('actionTitle');
            const desc = document.getElementById('actionDesc');

            if (state.goal === 'predict') {
                // In prediction, we include almost everything if it has signal
                res.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                title.innerText = "ACTION: INCLUDE THE VARIABLE";
                if (state.variable === 'confounder') desc.innerText = "Confounders carry strong predictive signal about the outcome. Including them will improve your model's accuracy (e.g. AUC-ROC).";
                if (state.variable === 'mediator') desc.innerText = "Mediators are highly informative about the outcome because they are on the pathway. Including them improves prediction accuracy.";
                if (state.variable === 'collider') desc.innerText = "Colliders can be included. While they theoretically carry no predictive value on their own, including them rarely harms a purely predictive machine learning model.";
            } else if (state.goal === 'causal') {
                if (state.variable === 'confounder') {
                    res.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    title.innerText = "ACTION: MUST ADJUST / INCLUDE";
                    desc.innerText = "Confounders are common causes of the exposure and outcome. You MUST adjust for them (via regression, matching, or IPTW) to close the backdoor path and get an unbiased causal effect.";
                }
                if (state.variable === 'mediator') {
                    res.classList.add('bg-indigo-50', 'border-indigo-500', 'text-indigo-900');
                    title.innerText = "ACTION: EXCLUDE (If estimating Total Effect)";
                    desc.innerText = "Conditioning on a mediator blocks the causal pathway. If you include it, you will only estimate the 'Direct Effect', artificially attenuating the 'Total Effect' of your exposure.";
                }
                if (state.variable === 'collider') {
                    res.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-900');
                    title.innerText = "ACTION: NEVER INCLUDE";
                    desc.innerText = "Conditioning on a collider opens a spurious association (Collider Bias / Berkson's Bias) between the exposure and outcome. Including this variable will ruin your causal estimate.";
                }
            }
        }
    </script>
</body>
</html>
