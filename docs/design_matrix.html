<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Design Decision Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Study Design Decision Matrix</h1>
            <a href="index.html" class="text-sm text-sky-600 hover:underline">Back to Portal</a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-6 bg-slate-800 text-white text-center">
                <p class="text-slate-300 text-sm uppercase font-bold tracking-widest">Inference Optimization Tool</p>
                <p class="mt-1 text-xs">Determine the most robust design for your specific causal question.</p>
            </div>

            <div class="p-8 space-y-8">
                <!-- Q1 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">1. Is the outcome rare? (Cumulative incidence < 1% per year)</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('rare', 'yes')" id="btn-rare-yes" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Yes (Rare Disease)</button>
                        <button onclick="setVal('rare', 'no')" id="btn-rare-no" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">No (Common Condition)</button>
                    </div>
                </div>

                <!-- Q2 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">2. Can you assign the exposure randomly?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('random', 'yes')" id="btn-random-yes" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Yes (Ethical & Feasible)</button>
                        <button onclick="setVal('random', 'no')" id="btn-random-no" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">No (Observational only)</button>
                    </div>
                </div>

                <!-- Q3 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wide">3. Do you have long-term funding/time for follow-up?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setVal('time', 'yes')" id="btn-time-yes" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">Yes (Years of tracking)</button>
                        <button onclick="setVal('time', 'no')" id="btn-time-no" class="border-2 border-slate-200 rounded-lg p-3 hover:bg-sky-50 transition">No (Fast results needed)</button>
                    </div>
                </div>

                <div id="resultBox" class="hidden p-8 rounded-xl border-2 bg-white shadow-xl transition-all duration-500 border-indigo-100">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="p-3 bg-indigo-600 text-white rounded-lg shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
                        </div>
                        <h3 class="text-2xl font-black text-slate-900" id="designName"></h3>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-6 mt-6">
                        <div class="p-4 bg-emerald-50 rounded-lg border border-emerald-100">
                            <span class="block text-xs font-bold text-emerald-700 uppercase mb-1">Causal Utility</span>
                            <p id="utilDesc" class="text-sm font-medium"></p>
                        </div>
                        <div class="p-4 bg-rose-50 rounded-lg border border-rose-100">
                            <span class="block text-xs font-bold text-rose-700 uppercase mb-1">Primary Bias Risk</span>
                            <p id="biasDesc" class="text-sm font-medium"></p>
                        </div>
                    </div>
                    <div class="mt-6 p-4 bg-slate-50 rounded-lg border border-slate-200">
                        <span class="block text-xs font-bold text-slate-500 uppercase mb-1">Analytic Priority</span>
                        <p id="logicDesc" class="text-sm italic"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = { rare: '', random: '', time: '' };

        function setVal(key, val) {
            state[key] = val;
            document.querySelectorAll(`[id^="btn-${key}"]`).forEach(b => b.classList.remove('bg-indigo-600', 'border-indigo-600', 'text-white'));
            document.getElementById(`btn-${key}-${val}`).classList.add('bg-indigo-600', 'border-indigo-600', 'text-white');
            calculate();
        }

        function calculate() {
            if (!state.rare || !state.random || !state.time) return;
            const res = document.getElementById('resultBox');
            res.classList.remove('hidden');

            const name = document.getElementById('designName');
            const util = document.getElementById('utilDesc');
            const bias = document.getElementById('biasDesc');
            const logic = document.getElementById('logicDesc');

            if (state.random === 'yes') {
                name.innerText = "Randomized Controlled Trial (RCT)";
                util.innerText = "VERY HIGH. Randomization handles both measured and unmeasured confounding.";
                bias.innerText = "Attrition bias and performance bias.";
                logic.innerText = "Focus on Intent-to-Treat (ITT) analysis and ensuring compliance.";
            } else if (state.rare === 'yes') {
                name.innerText = "Case-Control Study";
                util.innerText = "MEDIUM. Inefficient for absolute risk, but excellent for association.";
                bias.innerText = "Recall bias and selection bias (controls must represent source pop).";
                logic.innerText = "Use exposure Odds Ratios. Consider nested design to mitigate selection bias.";
            } else if (state.time === 'yes') {
                name.innerText = "Prospective Cohort Study";
                util.innerText = "HIGH. Establishes temporality clearly and allows multiple outcomes.";
                bias.innerText = "Loss to follow-up (LTFU) and unmeasured confounding.";
                logic.innerText = "Estimate Risk Ratios (RR) or Hazard Ratios (HR). Use IPCW if LTFU is non-random.";
            } else {
                name.innerText = "Cross-Sectional / Ecological";
                util.innerText = "LOW. Best for hypothesis generation and prevalence estimation.";
                bias.innerText = "Reverse causation and survival bias.";
                logic.innerText = "Estimate Prevalence Ratios (PR). Do not make causal claims without strong assumptions.";
            }
        }
    </script>
</body>
</html>
