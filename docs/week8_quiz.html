<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 Practice Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 p-8">

    <div class="max-w-2xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Critical Appraisal Quiz</h1>
            <a href="index.html" class="text-sm text-emerald-600 hover:underline">Back to Portal</a>
        </div>

        <div id="quiz-container" class="bg-white rounded-xl shadow-sm border border-slate-200 p-8"></div>

        <div id="result-container" class="hidden mt-6 bg-emerald-50 border border-emerald-200 p-6 rounded-xl text-center">
            <h2 class="text-2xl font-bold text-emerald-800 mb-2">Quiz Complete!</h2>
            <p class="text-emerald-700">You scored <span id="score" class="font-bold text-xl"></span> out of 4.</p>
            <p class="text-sm text-emerald-600 mt-4">"The ability to identify bias separates a competent data analyst from a rigorous epidemiologist."</p>
            <button onclick="location.reload()" class="mt-4 bg-emerald-600 text-white px-4 py-2 rounded font-medium hover:bg-emerald-700 transition">Retry Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "A case-control study of occupational asbestos exposure recruits cases from a tertiary cancer hospital and controls from healthy volunteers at a general health fair. Which bias is most likely?",
                options: ["Selection bias (Volunteer bias)", "Recall bias", "Berkson's bias", "All of the above"],
                correct: 3,
                explanation: "Cases are hospital-selected, controls are volunteers (Selection), and cases are more motivated to search memory (Recall)."
            },
            {
                question: "A cross-sectional survey in Nairobi finds phone users sleep 1.2 hours less. Why can't the authors conclude that phones cause sleep deprivation?",
                options: ["Reverse causation (poor sleep leads to more phone use)", "Survival bias", "Neyman bias", "Publication bias"],
                correct: 0,
                explanation: "Cross-sectional designs lack temporality. We cannot establish if the phone use preceded the sleep deprivation."
            },
            {
                question: "If a measurement error is 'non-differential' (equal across groups), in which direction is the observed association typically biased?",
                options: ["Away from the null (exaggerated)", "Toward the null (attenuated)", "Unpredictable direction", "It does not affect the OR"],
                correct: 1,
                explanation: "Non-differential misclassification typically pulls the effect estimate toward 1.0 (no association)."
            },
            {
                question: "An RCT in the UK finds a drug reduces CVD by 32%. Before adopting this in Kenya, you worry about CYP enzyme polymorphisms affecting drug metabolism. This is a concern regarding:",
                options: ["Internal Validity", "External Validity (Transportability)", "Recall Bias", "Random Error"],
                correct: 1,
                explanation: "Pharmacogenomic differences between UK and Kenyan populations threaten the ability to transport findings from one setting to the other."
            }
        ];

        let currentQ = 0; let score = 0;
        const container = document.getElementById('quiz-container');

        function loadQuestion() {
            if (currentQ >= questions.length) {
                container.classList.add('hidden');
                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('score').innerText = score;
                return;
            }
            const q = questions[currentQ];
            let html = `<h2 class="text-lg font-bold text-slate-800 mb-4">Q${currentQ + 1}: ${q.question}</h2><div class="space-y-3">`;
            q.options.forEach((opt, idx) => {
                html += `<button onclick="checkAnswer(${idx})" class="w-full text-left p-4 rounded-lg border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 transition-colors">${opt}</button>`;
            });
            html += `</div><div id="feedback" class="mt-4 hidden p-3 rounded text-sm"></div>`;
            container.innerHTML = html;
        }

        function checkAnswer(selected) {
            const q = questions[currentQ];
            const feedback = document.getElementById('feedback');
            if(!feedback.classList.contains('hidden')) return;
            feedback.classList.remove('hidden');
            if (selected === q.correct) {
                score++;
                feedback.className = "mt-4 p-3 rounded text-sm bg-emerald-100 text-emerald-800";
                feedback.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
            } else {
                feedback.className = "mt-4 p-3 rounded text-sm bg-rose-100 text-rose-800";
                feedback.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
            }
            setTimeout(() => { currentQ++; loadQuestion(); }, 4000);
        }
        loadQuestion();
    </script>
</body>
</html>
